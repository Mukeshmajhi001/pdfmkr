<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TU Assignment Cover Page Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Libre+Baskerville:wght@400;700&display=swap');

  /* ===== NEUMORPHISM COLOR SYSTEM ===== */
  :root {
    /* DAY MODE */
    --bg: #e0e5ec;
    --card: #e0e5ec;
    --text: #2d3561;
    --text-muted: #7a89b8;
    --accent: #8b1a1a;
    --gold: #c8960c;
    --inp: #e0e5ec;
    --shadow-light: #ffffff;
    --shadow-dark: #a3b1c6;
    --btn-shadow-light: #ffffff;
    --btn-shadow-dark: #5a0e0e;
    --header-bg: linear-gradient(135deg, #6b1111 0%, #8b1a1a 60%, #a02020 100%);
    --neu-flat: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
    --neu-pressed: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
    --neu-raised: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
    --neu-input: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
    --border-color: transparent;
    --toggle-icon: "🌙";
  }

  [data-theme="dark"] {
    /* NIGHT MODE */
    --bg: #1e2235;
    --card: #232840;
    --text: #e0e5f0;
    --text-muted: #8892b0;
    --accent: #c94040;
    --gold: #e6b44e;
    --inp: #232840;
    --shadow-light: #2e3455;
    --shadow-dark: #141729;
    --btn-shadow-light: #2e3455;
    --btn-shadow-dark: #6b0000;
    --header-bg: linear-gradient(135deg, #3d0808 0%, #5a1010 60%, #6e1515 100%);
    --neu-flat: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
    --neu-pressed: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
    --neu-raised: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
    --neu-input: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
    --border-color: transparent;
    --toggle-icon: "☀️";
  }

  * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s, box-shadow 0.3s; }

  body {
    background: var(--bg);
    font-family: 'Crimson Pro', Georgia, serif;
    color: var(--text);
    min-height: 100vh;
  }

  /* ===== HEADER ===== */
  header {
    background: var(--header-bg);
    color: #fff;
    padding: 22px 36px;
    text-align: center;
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  header::after {
    content: '';
    display: block;
    height: 3px;
    background: linear-gradient(90deg, transparent 0%, var(--gold) 20%, var(--gold) 80%, transparent 100%);
    margin-top: 14px;
  }
  header h1 {
    font-family: 'Libre Baskerville', serif;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  header p { font-size: 0.88rem; opacity: 0.78; margin-top: 3px; }

  /* ===== THEME TOGGLE ===== */
  .toggle-wrap {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
  }
  .theme-btn {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 1.1rem;
    color: #fff;
    backdrop-filter: blur(4px);
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .theme-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); }
  .theme-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; }

  /* ===== WRAP & CARD ===== */
  .wrap {
    max-width: 680px;
    margin: 40px auto 80px;
    padding: 0 20px;
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 36px 40px 40px;
    box-shadow: var(--neu-raised);
  }

  /* ===== SECTION TITLES ===== */
  .sec {
    font-family: 'Libre Baskerville', serif;
    font-size: 0.70rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    padding-bottom: 8px;
    margin: 32px 0 20px;
    position: relative;
  }
  .sec::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 1.5px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .sec:first-of-type { margin-top: 0; }

  /* ===== GRID ===== */
  .grid { display: grid; gap: 18px; }
  .col2 { grid-template-columns: 1fr 1fr; gap: 16px; }

  /* ===== FIELDS ===== */
  .fld { display: flex; flex-direction: column; gap: 7px; }
  label {
    font-size: 0.70rem;
    font-weight: 700;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* ===== NEUMORPHIC INPUTS ===== */
  input, select {
    background: var(--inp);
    border: none;
    border-radius: 10px;
    padding: 12px 15px;
    font-family: 'Crimson Pro', serif;
    font-size: 1rem;
    color: var(--text);
    width: 100%;
    box-shadow: var(--neu-input);
    outline: none;
    transition: box-shadow 0.25s, color 0.3s, background 0.3s;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus, select:focus {
    box-shadow: var(--neu-pressed), 0 0 0 2px var(--accent);
  }
  input::placeholder { color: var(--text-muted); opacity: 0.6; }
  select { cursor: pointer; }

  /* ===== NEUMORPHIC RADIO BUTTONS ===== */
  .radios { display: flex; flex-wrap: wrap; gap: 12px; }
  .radios input[type=radio] { display: none; }
  .radios label {
    display: block;
    padding: 10px 20px;
    background: var(--inp);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.92rem;
    font-weight: 400;
    letter-spacing: 0.01em;
    text-transform: none;
    color: var(--text);
    box-shadow: var(--neu-flat);
    transition: all 0.2s;
  }
  .radios input[type=radio]:checked + label {
    background: var(--accent);
    color: #fff;
    box-shadow: var(--neu-pressed);
    font-weight: 700;
  }
  .radios label:hover:not(:has(input:checked)) {
    box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
  }

  .custom-hidden { display: none; }

  /* ===== DIVIDER ===== */
  .hr {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--shadow-dark), transparent);
    margin: 24px 0;
    opacity: 0.5;
  }

  /* ===== GENERATE BUTTON ===== */
  .btn {
    width: 100%;
    background: var(--bg);
    color: var(--accent);
    border: none;
    padding: 16px 24px;
    font-family: 'Libre Baskerville', serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-radius: 14px;
    cursor: pointer;
    margin-top: 30px;
    box-shadow: var(--neu-flat);
    transition: box-shadow 0.2s, transform 0.12s, color 0.3s;
  }
  .btn:hover {
    box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
    color: var(--gold);
    transform: translateY(-2px);
  }
  .btn:active {
    box-shadow: var(--neu-pressed);
    transform: translateY(1px);
  }

  .hint { text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-top: 12px; }

  /* ===== TOAST ===== */
  .toast {
    display: none;
    background: var(--bg);
    color: #2e7d32;
    box-shadow: var(--neu-flat);
    border-radius: 10px;
    padding: 12px 18px;
    text-align: center;
    margin-top: 16px;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .toast.show { display: block; }

  @media(max-width:520px){
    .card { padding: 22px 18px; }
    .col2 { grid-template-columns: 1fr; }
    header h1 { font-size: 1.3rem; }
    .toggle-wrap { position: static; transform: none; margin-top: 10px; display: flex; justify-content: center; }
    header { padding-bottom: 14px; }
  }
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
</head>
<body>

<header>
  <div class="toggle-wrap">
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">
      <span id="themeIcon">🌙</span>
      <span class="theme-label" id="themeLabel">Night</span>
    </button>
  </div>
  <h1>TU Assignment Cover Page Generator</h1>
  <p>Tribhuvan University &mdash; Official Cover Page PDF</p>
</header>

<div class="wrap">
<div class="card">

  <div class="sec">Document Type</div>
  <div class="fld">
    <label>Select document type</label>
    <div class="radios">
      <div><input type="radio" name="dtype" id="d1" value="Assignment" checked onchange="toggleDtype()"><label for="d1">Assignment</label></div>
      <div><input type="radio" name="dtype" id="d2" value="Lab Report" onchange="toggleDtype()"><label for="d2">Lab Report</label></div>
      <div><input type="radio" name="dtype" id="d3" value="Project Report" onchange="toggleDtype()"><label for="d3">Project Report</label></div>
      <div><input type="radio" name="dtype" id="d4" value="other_dtype" onchange="toggleDtype()"><label for="d4">Other</label></div>
    </div>
  </div>
  <div class="fld custom-hidden" id="customDtypeBox" style="margin-top:12px;">
    <label>Specify Document Type</label>
    <input type="text" id="customDtype" placeholder="e.g. Practical Report">
  </div>

  <div class="hr"></div>
  <div class="sec">Subject</div>
  <div class="grid">
    <div class="fld">
      <label>Select Subject</label>
      <select id="subSel" onchange="toggleCustom()">
        <option value="">-- Select Subject --</option>
        <option value="Numerical Methods">Numerical Methods</option>
        <option value="Scripting Language">Scripting Language</option>
        <option value="Operating Systems">Operating Systems</option>
        <option value="Database Management System">Database Management System</option>
        <option value="Software Engineering">Software Engineering</option>
        <option value="custom">Other (type below)</option>
      </select>
    </div>
    <div class="fld custom-hidden" id="customBox">
      <label>Custom Subject Name</label>
      <input type="text" id="customSub" placeholder="e.g. Artificial Intelligence">
    </div>
  </div>

  <div class="hr"></div>
  <div class="sec">College Information</div>
  <div class="grid">
    <div class="fld">
      <label>Faculty</label>
      <select id="faculty" onchange="toggleFaculty()">
        <option value="Faculty of Humanities and Social Sciences">Faculty of Humanities and Social Sciences</option>
        <option value="Faculty of Science and Technology">Faculty of Science and Technology</option>
        <option value="Faculty of Management">Faculty of Management</option>
        <option value="Faculty of Education">Faculty of Education</option>
        <option value="Faculty of Law">Faculty of Law</option>
        <option value="other_faculty">Other (type below)</option>
      </select>
    </div>
    <div class="fld custom-hidden" id="customFacultyBox">
      <label>Specify Faculty Name</label>
      <input type="text" id="customFaculty" placeholder="e.g. Faculty of Engineering">
    </div>
    <div class="fld">
      <label>College Name</label>
      <input type="text" id="college" value="Mahendra Morang Adarsha Multiple College">
    </div>
    <div class="fld">
      <label>Location</label>
      <input type="text" id="location" value="Biratnagar Morang">
    </div>
  </div>

  <div class="hr"></div>
  <div class="sec">Submitted By (Student)</div>
  <div class="grid">
    <div class="col2" style="display:grid">
      <div class="fld">
        <label>Student Name</label>
        <input type="text" id="sName" placeholder="e.g. Mukesh Kumar Majhi">
      </div>
      <div class="fld">
        <label>Roll Number</label>
        <input type="text" id="sRoll" placeholder="e.g. 37">
      </div>
    </div>
    <div class="fld">
      <label>Semester / Year (optional)</label>
      <input type="text" id="sSem" placeholder="e.g. 5th Semester / 2nd Year BCA">
    </div>
  </div>

  <div class="hr"></div>
  <div class="sec">Submitted To (Teacher)</div>
  <div class="grid">
    <div class="fld">
      <label>Teacher Name</label>
      <input type="text" id="tName" placeholder="e.g. Guru Sharan Giri">

    </div>
    <div class="fld">
      <label>Designation (optional)</label>
      <input type="text" id="tDesig" placeholder="e.g. Assistant Professor">
    </div>
  </div>

  <button class="btn" onclick="makePDF()">&#8595; Generate &amp; Download PDF</button>
  <div class="toast" id="toast">&#10003; PDF downloaded successfully!</div>
  <p class="hint">PDF will be generated exactly like TU official format</p>

</div>
</div>

<script>
// ===== THEME TOGGLE =====
function toggleTheme() {
  const body = document.documentElement;
  const isDark = body.getAttribute('data-theme') === 'dark';
  if (isDark) {
    body.removeAttribute('data-theme');
    document.getElementById('themeIcon').textContent = '🌙';
    document.getElementById('themeLabel').textContent = 'Night';
    localStorage.setItem('tuTheme', 'light');
  } else {
    body.setAttribute('data-theme', 'dark');
    document.getElementById('themeIcon').textContent = '☀️';
    document.getElementById('themeLabel').textContent = 'Day';
    localStorage.setItem('tuTheme', 'dark');
  }
}

// Load saved theme
(function() {
  const saved = localStorage.getItem('tuTheme');
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('themeIcon').textContent = '☀️';
    document.getElementById('themeLabel').textContent = 'Day';
  }
})();

// ===== TOGGLE FUNCTIONS (BUG FIXED) =====
function toggleCustom() {
  const val = document.getElementById('subSel').value;
  document.getElementById('customBox').classList.toggle('custom-hidden', val !== 'custom');
}

function toggleDtype() {
  const val = document.querySelector('input[name=dtype]:checked').value;
  document.getElementById('customDtypeBox').classList.toggle('custom-hidden', val !== 'other_dtype');
}

function toggleFaculty() {
  const val = document.getElementById('faculty').value;
  document.getElementById('customFacultyBox').classList.toggle('custom-hidden', val !== 'other_faculty');
}

function getDtype() {
  const val = document.querySelector('input[name=dtype]:checked').value;
  if (val === 'other_dtype') return document.getElementById('customDtype').value.trim() || 'Other';
  return val;
}

function getSubject() {
  const v = document.getElementById('subSel').value;
  return v === 'custom' ? document.getElementById('customSub').value.trim() : v;
}

// ===== PDF GENERATOR (BUG FIXED: JPEG format for logo) =====
function makePDF() {
  const { jsPDF } = window.jspdf;

  const dtype   = getDtype();
  const subject = getSubject();
  const facVal   = document.getElementById('faculty').value;
  const faculty  = facVal === 'other_faculty' ? (document.getElementById('customFaculty').value.trim() || 'Faculty') : facVal;
  const college = document.getElementById('college').value.trim() || 'Mahendra Morang Adarsha Multiple College';
  const loc     = document.getElementById('location').value.trim();
  const sName   = document.getElementById('sName').value.trim();
  const sRoll   = document.getElementById('sRoll').value.trim();
  const sSem    = document.getElementById('sSem').value.trim();
  const tName   = document.getElementById('tName').value.trim();
  const tDesig  = document.getElementById('tDesig').value.trim();

  if (!sName)   { alert('Please enter student name!'); return; }
  if (!sRoll)   { alert('Please enter roll number!'); return; }
  if (!tName)   { alert('Please enter teacher name!'); return; }
  if (!subject) { alert('Please select or type a subject!'); return; }

  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const W = 595.28, H = 841.89, cx = W / 2;

  // ── Outer border: thick red + thin black (same layout, new colors) ──
  doc.setDrawColor(180, 0, 0);
  doc.setLineWidth(3);
  doc.rect(24, 24, W - 48, H - 48);
  doc.setLineWidth(1);
  doc.setDrawColor(0, 0, 0);
  doc.rect(32, 32, W - 64, H - 64);

  // Header: University — dark red text
  doc.setFont('times', 'bold');
  doc.setFontSize(22);
  doc.setTextColor(180, 0, 0);
  doc.text('Tribhuvan University', cx, 88, { align: 'center' });

  doc.setFontSize(15);
  doc.setTextColor(0, 0, 0);
  doc.text(faculty, cx, 110, { align: 'center' });

  // Separator line — red
  doc.setDrawColor(180, 0, 0);
  doc.setLineWidth(1.5);
  doc.line(70, 120, W - 70, 120);

  doc.setFont('times', 'bold');
  doc.setFontSize(13);
  doc.setTextColor(0, 0, 0);
  doc.text(college.toUpperCase(), cx, 140, { align: 'center' });

  doc.setFontSize(12);
  doc.setTextColor(50, 50, 50);
  doc.text(loc.toUpperCase(), cx, 157, { align: 'center' });

  // Separator line — black
  doc.setDrawColor(0, 0, 0);
  doc.setLineWidth(1);
  doc.line(70, 167, W - 70, 167);

  // Logo
  const logoSize = 130;
  const logoX = cx - logoSize / 2;
  const logoY = 182;
  try {
    doc.addImage(LOGO, 'JPEG', logoX, logoY, logoSize, logoSize);
  } catch(e) {
    doc.addImage(LOGO, logoX, logoY, logoSize, logoSize);
  }

  // "dtype on" — red
  doc.setFont('times', 'bold');
  doc.setFontSize(16);
  doc.setTextColor(180, 0, 0);
  doc.text(dtype + ' on', cx, logoY + logoSize + 30, { align: 'center' });

  // Subject — black
  doc.setFontSize(20);
  doc.setTextColor(0, 0, 0);
  const subLines = doc.splitTextToSize(subject, 420);
  let sy = logoY + logoSize + 58;
  subLines.forEach(l => { doc.text(l, cx, sy, { align: 'center' }); sy += 28; });

  // Semester — red italic
  if (sSem) {
    doc.setFont('times', 'italic');
    doc.setFontSize(12);
    doc.setTextColor(180, 0, 0);
    doc.text(sSem, cx, sy + 10, { align: 'center' });
    sy += 20;
  }

  // 3 vertical lines — red center, black sides
  doc.setDrawColor(0, 0, 0);
  doc.setLineWidth(2.5);
  const centerTopY  = sy + 14;
  const centerBotY  = centerTopY + 130;
  const sideTopY    = centerTopY + 10;
  const sideBotY    = centerBotY - 10;
  doc.line(cx - 22, sideTopY,   cx - 22, sideBotY);
  doc.setDrawColor(180, 0, 0);
  doc.line(cx,      centerTopY, cx,      centerBotY);
  doc.setDrawColor(0, 0, 0);
  doc.line(cx + 22, sideTopY,   cx + 22, sideBotY);

  // Bottom separator — red
  const bY = H - 118;
  doc.setDrawColor(180, 0, 0);
  doc.setLineWidth(1);
  doc.line(70, bY, W - 70, bY);

  doc.setFontSize(12);

  // Submitted by — label red, value black
  doc.setFont('times', 'bold');
  doc.setTextColor(180, 0, 0);
  doc.text('Submitted by:', 80, bY + 20);
  doc.setFont('times', 'normal');
  doc.setTextColor(0, 0, 0);
  doc.text('Name: ' + sName, 80, bY + 38);
  doc.text('Roll No: ' + sRoll, 80, bY + 56);

  // Submitted to — label red, value black
  doc.setFont('times', 'bold');
  doc.setTextColor(180, 0, 0);
  doc.text('Submitted To:', W - 80, bY + 20, { align: 'right' });
  doc.setFont('times', 'normal');
  doc.setTextColor(0, 0, 0);
  doc.text(tName, W - 80, bY + 38, { align: 'right' });
  if (tDesig) doc.text(tDesig, W - 80, bY + 56, { align: 'right' });

  // Final bottom line — red
  doc.setDrawColor(180, 0, 0);
  doc.setLineWidth(1);
  doc.line(70, H - 44, W - 70, H - 44);

  const safeSubject = subject.replace(/ /g,'_').substring(0,25);
  const safeName    = sName.replace(/ /g,'_');
  const safeDtype   = dtype.replace(/ /g,'_');
  const fname = safeDtype + '_' + safeSubject + '_' + safeName + '.pdf';
  doc.save(fname);

  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
</body>
</html>
